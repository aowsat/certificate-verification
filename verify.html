<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1 class="title">
                Certificate Verification
            </h1>

            <p class="subtitle">
                Official Certificate Verification Portal
            </p>

            <div id="result">

                <p style="text-align:center;">
                    Verifying certificate...
                </p>

            </div>

            <div class="footer">
                This certificate has been electronically verified
                through the official verification system.
            </div>

        </div>

    </div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbz9G8kyCIsxHPvn3CMUbCHi6sWXZum213cmAPzgM9aT5_wp6yFR-QaQ1Eg_ARx3gixd5A/exec";


const params = new URLSearchParams(window.location.search);

const certificateId = params.get("id");


if (!certificateId) {

    document.getElementById("result").innerHTML = `

        <div class="verified" style="color:#c62828;">
            ✕ Certificate ID Missing
        </div>

        <p style="text-align:center;">
            Please scan a valid certificate QR code.
        </p>

    `;

} else {

    fetch(API_URL + "?id=" + encodeURIComponent(certificateId))

        .then(response => response.json())

        .then(data => {

            if (data.status === "success") {

                document.getElementById("result").innerHTML = `

                    <div class="verified">
                        ✓ Certificate Verified
                    </div>

                    <div class="info-row">
                        <span class="label">
                            Certificate ID
                        </span>

                        <span class="value">
                            ${data.certificateId}
                        </span>
                    </div>


                    <div class="info-row">
                        <span class="label">
                            Student Name
                        </span>

                        <span class="value">
                            ${data.studentName}
                        </span>
                    </div>


                    <div class="info-row">
                        <span class="label">
                            Course Name
                        </span>

                        <span class="value">
                            ${data.courseName}
                        </span>
                    </div>


                    <div class="info-row">
                        <span class="label">
                            Course Duration
                        </span>

                        <span class="value">
                            ${data.courseDuration}
                        </span>
                    </div>


                    <div class="info-row">
                        <span class="label">
                            Completion Date
                        </span>

                        <span class="value">
                            ${data.completionDate}
                        </span>
                    </div>


                    <div class="info-row">
                        <span class="label">
                            Issue Date
                        </span>

                        <span class="value">
                            ${data.issueDate}
                        </span>
                    </div>


                    <div class="info-row">
                        <span class="label">
                            Institute Name
                        </span>

                        <span class="value">
                            ${data.instituteName}
                        </span>
                    </div>


                    <div class="info-row">
                        <span class="label">
                            Certificate Status
                        </span>

                        <span class="value valid">
                            ${data.certificateStatus}
                        </span>
                    </div>

                `;

            } else {

                document.getElementById("result").innerHTML = `

                    <div class="verified"
                         style="color:#c62828;">
                        ✕ Certificate Not Found
                    </div>

                    <p style="text-align:center;">
                        This certificate could not be verified.
                    </p>

                `;

            }

        })

        .catch(error => {

            document.getElementById("result").innerHTML = `

                <div class="verified"
                     style="color:#c62828;">
                    ✕ Verification Error
                </div>

                <p style="text-align:center;">
                    Unable to connect to the verification server.
                </p>

            `;

        });

}

</script>

</body>
</html>
