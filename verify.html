<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1 class="title">
            Certificate Verification
        </h1>

        <p class="subtitle">
            Official Certificate Verification Portal
        </p>

        <div id="result">

            <p style="text-align:center;">
                Verifying certificate...
            </p>

        </div>

        <div class="footer">

            This certificate has been electronically verified
            through the official verification system.

        </div>

    </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxN1Xg93vHRMDNsMLfgDLIkCQnNNYVO-0zDMdYQQKH2o9XVpxN52L-rjPWCfh01Fg6R6w/exec";


const params =
new URLSearchParams(window.location.search);

const certificateId =
params.get("id");


if (!certificateId) {

    document.getElementById("result").innerHTML = `

        <div class="verified invalid">
            ✕ Certificate ID Missing
        </div>

        <p style="text-align:center;">
            Please scan a valid certificate QR code.
        </p>

    `;

} else {


    // Unique callback name

    const callbackName =
        "certificateCallback_" +
        Date.now();


    // Create callback function

    window[callbackName] = function(data) {


        // Remove script

        const script =
            document.getElementById("apiScript");

        if (script) {
            script.remove();
        }


        // Certificate found

        if (data.status === "success") {


            let isValid =
                String(data.certificateStatus)
                .toUpperCase() === "VALID";


            let statusClass =
                isValid ? "valid" : "invalid";


            let statusTitle =
                isValid
                ? "✓ Certificate Verified"
                : "✕ Certificate Invalid";


            document.getElementById("result").innerHTML = `

                <div class="verified ${statusClass}">
                    ${statusTitle}
                </div>


                <div class="info-row">

                    <span class="label">
                        Certificate ID
                    </span>

                    <span class="value">
                        ${data.certificateId}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Student Name
                    </span>

                    <span class="value">
                        ${data.studentName}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Course Name
                    </span>

                    <span class="value">
                        ${data.courseName}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Course Duration
                    </span>

                    <span class="value">
                        ${data.courseDuration}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Completion Date
                    </span>

                    <span class="value">
                        ${formatDate(data.completionDate)}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Issue Date
                    </span>

                    <span class="value">
                        ${formatDate(data.issueDate)}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Institute Name
                    </span>

                    <span class="value">
                        ${data.instituteName}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Certificate Status
                    </span>

                    <span class="value ${statusClass}">
                        ${data.certificateStatus}
                    </span>

                </div>

            `;

        }


        // Certificate not found

        else {

            document.getElementById("result").innerHTML = `

                <div class="verified invalid">
                    ✕ Certificate Not Found
                </div>

                <p style="text-align:center;">
                    This certificate could not be verified.
                </p>

            `;

        }


        delete window[callbackName];

    };


    // Create JSONP request

    const script =
        document.createElement("script");


    script.id = "apiScript";


    script.src =
        API_URL +
        "?id=" +
        encodeURIComponent(certificateId) +
        "&callback=" +
        callbackName;


    script.onerror = function() {

        document.getElementById("result").innerHTML = `

            <div class="verified invalid">
                ✕ Verification Error
            </div>

            <p style="text-align:center;">
                Unable to connect to the verification server.
            </p>

        `;

        delete window[callbackName];

    };


    document.body.appendChild(script);

}


function formatDate(dateString) {

    if (!dateString) {
        return "";
    }


    const date =
        new Date(dateString);


    if (isNaN(date.getTime())) {
        return dateString;
    }


    return date.toLocaleDateString(
        "en-GB",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );

}

</script>

</body>

</html>
