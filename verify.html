<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <div class="card">

            <h1 class="title">
                Certificate Verification
            </h1>

            <p class="subtitle">
                Official Certificate Verification Portal
            </p>


            <div id="result">

                <p style="text-align:center;">
                    Verifying certificate...
                </p>

            </div>


            <div class="footer">

                This certificate has been electronically verified
                through the official verification system.

            </div>

        </div>

    </div>



<script>


// Google Apps Script API

const API_URL =
"https://script.google.com/macros/s/AKfycbxN1Xg93vHRMDNsMLfgDLIkCQnNNYVO-0zDMdYQQKH2o9XVpxN52L-rjPWCfh01Fg6R6w/exec";


// Get Certificate ID from URL

const params = new URLSearchParams(window.location.search);

const certificateId = params.get("id");


// Certificate ID missing

if (!certificateId) {

    document.getElementById("result").innerHTML = `

        <div class="verified invalid">

            ✕ Certificate ID Missing

        </div>

        <p style="text-align:center;">

            Please scan a valid certificate QR code.

        </p>

    `;

}


// Certificate ID found

else {

    fetch(
        API_URL + "?id=" +
        encodeURIComponent(certificateId)
    )

    .then(response => response.json())

    .then(data => {


        // Certificate found

        if (data.status === "success") {


            // Certificate status

            let statusText = data.certificateStatus;


            let statusClass = "valid";


            if (
                String(statusText).toUpperCase() !== "VALID"
            ) {

                statusClass = "invalid";

            }


            // Display certificate

            document.getElementById("result").innerHTML = `

                <div class="verified ${statusClass}">

                    ${statusClass === "valid"
                        ? "✓ Certificate Verified"
                        : "✕ Certificate Invalid"
                    }

                </div>


                <div class="info-row">

                    <span class="label">
                        Certificate ID
                    </span>

                    <span class="value">
                        ${data.certificateId}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Student Name
                    </span>

                    <span class="value">
                        ${data.studentName}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Course Name
                    </span>

                    <span class="value">
                        ${data.courseName}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Course Duration
                    </span>

                    <span class="value">
                        ${data.courseDuration}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Completion Date
                    </span>

                    <span class="value">
                        ${formatDate(data.completionDate)}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Issue Date
                    </span>

                    <span class="value">
                        ${formatDate(data.issueDate)}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Institute Name
                    </span>

                    <span class="value">
                        ${data.instituteName}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Certificate Status
                    </span>

                    <span class="value ${statusClass}">

                        ${statusText}

                    </span>

                </div>

            `;

        }


        // Certificate not found

        else {

            document.getElementById("result").innerHTML = `

                <div class="verified invalid">

                    ✕ Certificate Not Found

                </div>

                <p style="text-align:center;">

                    This certificate could not be verified.

                </p>

            `;

        }

    })


    // Connection error

    .catch(error => {

        document.getElementById("result").innerHTML = `

            <div class="verified invalid">

                ✕ Verification Error

            </div>

            <p style="text-align:center;">

                Unable to connect to the verification server.

            </p>

        `;

    });

}



// Format date

function formatDate(dateString) {

    if (!dateString) {

        return "";

    }


    const date = new Date(dateString);


    if (isNaN(date.getTime())) {

        return dateString;

    }


    return date.toLocaleDateString(
        "en-GB",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );

}


</script>


</body>

</html>
