<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

        }


        .login-box {

            width: 100%;

            max-width: 400px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.10);

        }


        h1 {

            text-align: center;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 15px;

        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #1a73e8;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.9;

        }


        #error {

            display: none;

            margin-top: 15px;

            padding: 10px;

            text-align: center;

            color: #c62828;

            background: #ffebee;

            border-radius: 6px;

        }

    </style>

</head>


<body>


<div class="login-box">

    <h1>Admin Login</h1>

    <p class="subtitle">
        Certificate Management System
    </p>


    <form id="loginForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div id="error">
        Invalid username or password.
    </div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;


        /*
         * Temporary login
         *
         * We will replace this with
         * secure Google Apps Script
         * authentication later.
         */


        if (
            username === "admin" &&
            password === "admin123"
        ) {

            window.location.href =
                "dashboard.html";

        }

        else {

            document
                .getElementById("error")
                .style.display = "block";

        }

    });

</script>


</body>

</html>
